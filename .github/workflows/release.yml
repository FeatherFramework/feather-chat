name: release

on:
  push:
    branches: [main]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Verify release versions
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./web/package.json').version")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          grep -Fqx "version '$version'" fxmanifest.lua
      - name: Install UI dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./web
      - name: Validate and build UI
        run: pnpm check
        working-directory: ./web
      - name: Package resource
        uses: vimtor/action-zip@v1
        with:
          files: fxmanifest.lua LICENSE README.md config.lua client server shared translations ui
          recursive: false
          dest: feather-chat.zip
      - name: Upload tested package
        uses: actions/upload-artifact@v4
        with:
          name: feather-chat-install
          path: feather-chat.zip

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download tested package
        uses: actions/download-artifact@v4
        with:
          name: feather-chat-install
      - name: Read package version
        id: package-version
        uses: martinbeentjes/npm-get-version-action@main
        with:
          path: web
      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./web/package.json').version")
          grep -Fqx "version '$version'" fxmanifest.lua
      - name: Publish automatic release
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          automatic_release_tag: v${{ steps.package-version.outputs.current-version }}
          prerelease: ${{ contains(steps.package-version.outputs.current-version, '-') }}
          title: Feather Chat ${{ steps.package-version.outputs.current-version }}
          files: feather-chat.zip
